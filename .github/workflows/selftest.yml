name: Lab selftest
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest Python the GitHub runners still provide (3.9 is gone on Ubuntu 26.04).
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Every lab's starter.py must fail its check and the reference solution must pass.
      - run: python3 lab.py selftest
